<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Judul Halaman & Favicon (Ikon di Tab Browser) -->
    <title>Pengaduan Sarana dan Prasarana SMAN 1 Cidahu</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Meta Tag Open Graph (Untuk Tampilan Preview saat di-share di WhatsApp) -->
    <meta property="og:title" content="Pengaduan Sarana dan Prasarana SMAN 1 Cidahu">
    <meta property="og:description" content="Layanan resmi pelaporan dan pengaduan fasilitas sarana prasarana sekolah SMAN 1 Cidahu.">
    <!-- Ganti URL di bawah ini dengan link penuh (HTTPS) ke file logo.png Anda setelah di-hosting -->
    <meta property="og:image" content="https://username-anda.github.io/nama-repo/logo.png">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Styling Logo Sekolah */
        .school-logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin: 0 auto 14px auto;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 21px;
            margin-bottom: 12px;
            font-weight: 700;
            line-height: 1.3;
        }
        p {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        /* Animasi Spinner */
        .spinner {
            width: 38px;
            height: 38px;
            border: 3.5px solid rgba(255, 255, 255, 0.15);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Progress Bar 3 Detik */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            animation: loadProgress 3s linear forwards;
        }
        @keyframes loadProgress {
            to { width: 100%; }
        }
        .status-text {
            font-size: 13px;
            color: #94a3b8;
        }
        .manual-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 12px;
            color: #38bdf8;
            text-decoration: none;
        }
        .manual-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo Sekolah di Halaman Utama -->
        <img src="logo.png" alt="Logo SMAN 1 Cidahu" class="school-logo">
        
        <div class="badge">SMAN 1 Cidahu</div>
        <h1>Pengaduan Sarana dan Prasarana SMAN 1 Cidahu</h1>
        <p>Anda akan segera diarahkan ke formulir resmi pengaduan Sarana dan Prasarana Sekolah SMAN 1 Cidahu...</p>
        
        <div class="spinner"></div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="status-text">Mengalihkan dalam <span id="countdown">3</span> detik...</div>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScf4hrWusuhYfjZOm7EL1osBAGaM9oG9KOmW3HFqQo6_BTjfg/viewform?usp=header" class="manual-link">Klik di sini jika tidak berpindah otomatis</a>
    </div>

    <script>
        const targetUrl = "https://docs.google.com/forms/d/e/1FAIpQLScf4hrWusuhYfjZOm7EL1osBAGaM9oG9KOmW3HFqQo6_BTjfg/viewform?usp=header";
        let timeLeft = 3; // Durasi 3 detik
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownEl.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
