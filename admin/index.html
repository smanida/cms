<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Operator | SMAN 1 Cidahu</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dq4snx0ml/image/upload/v1762918483/logosma_ppjhiz.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 antialiased selection:bg-brand-600 selection:text-white">

  <div class="max-w-md w-full">
    <!-- Card Login -->
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 sm:p-10 border border-slate-200/80">
      
      <!-- Brand & Header -->
      <div class="text-center mb-8">
        <div class="inline-flex p-3 rounded-2xl bg-brand-50 border border-brand-100 shadow-sm mb-4">
          <img 
            src="https://res.cloudinary.com/dq4snx0ml/image/upload/v1762918483/logosma_ppjhiz.png" 
            alt="Logo SMAN 1 Cidahu" 
            class="w-12 h-12 object-contain"
          >
        </div>
        <h1 class="text-xl font-black text-slate-900 tracking-tight">PORTAL OPERATOR</h1>
        <p class="text-xs text-slate-500 mt-1">SMAN 1 Cidahu • Content Management System</p>
      </div>

      <!-- Alert Error -->
      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
        <i class="ph ph-warning-circle text-base shrink-0"></i>
        <span id="alertMsg">Terjadi kesalahan</span>
      </div>

      <!-- Form Login -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Alamat Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i class="ph ph-envelope-simple text-base"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              required 
              placeholder="nama@sekolah.sch.id" 
              class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kata Sandi</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i class="ph ph-lock-key text-base"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition"
            >
            <button 
              type="button" 
              onclick="togglePassword()" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
            >
              <i id="toggleIcon" class="ph ph-eye text-base"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="btnSubmit" 
          class="w-full mt-2 bg-brand-700 hover:bg-brand-800 text-white font-semibold py-2.5 px-4 rounded-xl text-xs sm:text-sm shadow-md shadow-brand-700/20 transition flex items-center justify-center gap-2"
        >
          <span>Masuk ke Panel</span>
          <i class="ph ph-arrow-right font-bold"></i>
        </button>
      </form>

      <!-- Footer Link -->
      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <a href="../index.html" class="text-xs font-medium text-slate-500 hover:text-brand-700 inline-flex items-center gap-1.5 transition">
          <i class="ph ph-arrow-left"></i> Kembali ke Beranda Sekolah
        </a>
      </div>

    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    // 1. Cek jika sesi sudah aktif, langsung redirect ke dashboard
    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        window.location.href = './dashboard.html';
      }
    }
    checkSession();

    // 2. Fitur Hide / Show Password
    function togglePassword() {
      const passField = document.getElementById('password');
      const icon = document.getElementById('toggleIcon');
      if (passField.type === 'password') {
        passField.type = 'text';
        icon.className = 'ph ph-eye-slash text-base';
      } else {
        passField.type = 'password';
        icon.className = 'ph ph-eye text-base';
      }
    }

    // 3. Proses Login
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="ph ph-spinner animate-spin text-base"></i> Memverifikasi...`;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        alertMsg.textContent = error.message === 'Invalid login credentials' 
          ? 'Email atau kata sandi tidak cocok.' 
          : error.message;
        alertBox.classList.remove('hidden');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Masuk ke Panel</span><i class="ph ph-arrow-right font-bold"></i>`;
      } else {
        window.location.href = './dashboard.html';
      }
    });
  </script>
</body>
</html>
